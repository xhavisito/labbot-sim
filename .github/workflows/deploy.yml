# Publica el simulador en GitHub Pages (rama gh-pages) desde main: https://xhavisito.github.io/labbot-sim/
# Todo se fusiona directo a main; ya no hay versión de pruebas (Xhavi, 18-nov).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publicar dist/ en gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir site
          git clone -q --depth 1 -b gh-pages "$REMOTE" site || true
          rm -rf site/.git
          # Reemplaza todo el sitio (esto también borra la carpeta /pruebas/ de la versión de pruebas que ya no existe)
          find site -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -r dist/. site/
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "deploy ${GITHUB_REF_NAME} ${GITHUB_SHA}"
          git push -f "$REMOTE" gh-pages
