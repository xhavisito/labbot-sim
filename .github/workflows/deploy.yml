# Publica el simulador en GitHub Pages con dos versiones en la misma rama gh-pages:
#  - main     -> https://xhavisito.github.io/labbot-sim/          (la que ve todo el mundo)
#  - pruebas  -> https://xhavisito.github.io/labbot-sim/pruebas/  (versión de pruebas de Xhavi)
# Cada despliegue reemplaza solo su parte y conserva la otra.
name: Deploy

on:
  push:
    branches: [main, pruebas]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publicar dist/ en gh-pages (main = raíz, pruebas = /pruebas/)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir site
          git clone -q --depth 1 -b gh-pages "$REMOTE" site || true
          rm -rf site/.git
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            find site -mindepth 1 -maxdepth 1 ! -name pruebas -exec rm -rf {} +
            cp -r dist/. site/
          else
            rm -rf site/pruebas
            mkdir -p site/pruebas
            cp -r dist/. site/pruebas/
            printf 'User-agent: *\nDisallow: /\n' > site/pruebas/robots.txt
            sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow">#' site/pruebas/index.html
          fi
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "deploy ${GITHUB_REF_NAME} ${GITHUB_SHA}"
          git push -f "$REMOTE" gh-pages
